        // --- HELPER FUNCTIONS ---
        
        function generateCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        function generateCorrelatedHistory(outcomes, points = 50) {
            const numOutcomes = outcomes.length;
            const histories = Array(numOutcomes).fill(null).map(() => []);
            
            let currentValues = Array(numOutcomes).fill(1 / numOutcomes);
            
            for (let t = 0; t < points; t++) {
                const progress = t / (points - 1);
                
                for (let i = 0; i < numOutcomes; i++) {
                    const target = outcomes[i].price;
                    const randomWalk = (Math.random() - 0.5) * 0.06 * (1 - progress);
                    
                    currentValues[i] = currentValues[i] + 
                        (target - currentValues[i]) * (0.08 + progress * 0.12) + 
                        randomWalk;
                }
                
                const sum = currentValues.reduce((a, b) => a + b, 0);
                currentValues = currentValues.map(v => v / sum);
                
                currentValues = currentValues.map(v => Math.max(0.01, Math.min(0.99, v)));
                
                const sumAfterClamp = currentValues.reduce((a, b) => a + b, 0);
                currentValues = currentValues.map(v => v / sumAfterClamp);
                
                for (let i = 0; i < numOutcomes; i++) {
                    histories[i].push(currentValues[i]);
                }
            }
            
            return histories;
        }

        function normalizeOutcomes(outcomes) {
            const sum = outcomes.reduce((acc, o) => acc + o.price, 0);
            if (sum === 0) {
                outcomes.forEach(o => o.price = 1 / outcomes.length);
            } else {
                outcomes.forEach(o => o.price = o.price / sum);
            }
            
            outcomes.forEach(o => {
                o.price = Math.max(0.01, Math.min(0.99, o.price));
            });
            
            const finalSum = outcomes.reduce((acc, o) => acc + o.price, 0);
            outcomes.forEach(o => o.price = o.price / finalSum);
        }

        // --- LMSR AUTOMATED MARKET MAKER (mathematically consistent) ---
        // We model an n-outcome prediction market where each share of the winning outcome pays $1 at resolution.
        // State per market:
        //   - bet.b : liquidity parameter (higher => deeper, less price impact)
        //   - outcome.q : outstanding shares for that outcome
        // Prices are derived from the LMSR cost function:
        //   C(q) = b * log(sum_j exp(q_j / b))
        //   price_i = dC/dq_i = exp(q_i/b) / sum_j exp(q_j/b)
        //
        // This guarantees no-arbitrage and coherent pricing across multiple outcomes.
        function lmsrCost(qs, b) {
            // numeric stability: subtract max
            const maxQ = Math.max(...qs);
            const sumExp = qs.reduce((acc, q) => acc + Math.exp((q - maxQ) / b), 0);
            return b * (Math.log(sumExp) + (maxQ / b));
        }

        function lmsrPrices(qs, b) {
            const maxQ = Math.max(...qs);
            const exps = qs.map(q => Math.exp((q - maxQ) / b));
            const denom = exps.reduce((a, e) => a + e, 0);
            return exps.map(e => e / denom);
        }

        function updatePricesFromQ(bet) {
            const qs = bet.outcomes.map(o => o.q || 0);
            const prices = lmsrPrices(qs, bet.b);
            bet.outcomes.forEach((o, i) => { o.price = prices[i]; });
            normalizeOutcomes(bet.outcomes); // keep within [0.01, 0.99] and sum=1 for UI stability
        }

        function ensureMarketState(bet) {
            // If a market was created without LMSR state, initialize it.
            if (!bet.b) {
                // heuristic depth: scales with number of outcomes
                bet.b = 80 * (bet.outcomes?.length || 2);
            }
            bet.outcomes.forEach(o => {
                if (typeof o.q !== 'number') o.q = 0;
                if (!o.history) o.history = Array(50).fill(1 / bet.outcomes.length);
            });
            if (typeof bet.volume !== 'number') bet.volume = 0;
            if (!bet.comments) bet.comments = [];
            if (!bet.resolution) bet.resolution = { status: null, proposedWinner: null, votes: {}, startedAt: null, finalizedAt: null };
            updatePricesFromQ(bet);
        }

        // Solve for delta shares (Δq) of a single outcome that costs `amount` dollars (buy) under LMSR.
        function solveDeltaForCost(qs, b, idx, amount) {
            const baseCost = lmsrCost(qs, b);
            // Find an upper bound by exponential search
            let lo = 0;
            let hi = Math.max(1, amount * 4); // starting guess
            const qsHi = qs.slice();
            while (true) {
                qsHi[idx] = qs[idx] + hi;
                const cost = lmsrCost(qsHi, b) - baseCost;
                if (cost >= amount) break;
                hi *= 2;
                if (hi > 1e7) break; // safety
            }
            // Binary search
            for (let it = 0; it < 60; it++) {
                const mid = (lo + hi) / 2;
                const qsMid = qs.slice();
                qsMid[idx] = qs[idx] + mid;
                const cost = lmsrCost(qsMid, b) - baseCost;
                if (cost >= amount) hi = mid;
                else lo = mid;
            }
            return hi;
        }

        // Refund you get for selling `delta` shares of a single outcome.
        function refundForDelta(qs, b, idx, delta) {
            const baseCost = lmsrCost(qs, b);
            const qsNew = qs.slice();
            qsNew[idx] = qs[idx] - delta;
            const newCost = lmsrCost(qsNew, b);
            return baseCost - newCost;
        }

        // Estimate buy shares without mutating the market
        function estimateBuy(bet, outcomeId, amount) {
            ensureMarketState(bet);
            const idx = bet.outcomes.findIndex(o => o.id === outcomeId);
            const qs = bet.outcomes.map(o => o.q);
            const delta = solveDeltaForCost(qs, bet.b, idx, amount);
            const avgPrice = amount / delta;
            return { shares: delta, avgPrice };
        }

        function doImport() {
            const input = document.getElementById('import-file');
            if (!input || !input.files || !input.files[0]) return showToast('Choose a file first', 'error');
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const payload = JSON.parse(reader.result);
                    const leagueCode = payload.leagueCode || (payload.league && payload.league.code);
                    const league = payload.league || null;
                    if (!leagueCode || !league) throw new Error('Invalid file');
                    if (!state.leagues[leagueCode]) state.leagues[leagueCode] = league;
                    else {
                        // merge bets by id
                        const existing = state.leagues[leagueCode];
                        const byId = new Map(existing.bets.map(b => [b.id, b]));
                        for (const b of (league.bets || [])) {
                            if (!byId.has(b.id)) existing.bets.push(b);
                        }
                        // merge members (unique)
                        existing.members = Array.from(new Set([...(existing.members||[]), ...(league.members||[])]));
                    }
                    state.currentLeague = leagueCode;
                    saveAppState();
                    closeModal();
                    showToast('League imported');
                    updateUI();
                } catch (e) {
                    showToast('Import failed', 'error');
                }
            };
            reader.readAsText(file);
        }

function renderPositionList(positions) {
            const league = state.leagues[state.currentLeague];
            ensureLeagueExtras(league);
            const bets = getCurrentBets();
            const activeBets = bets.filter(b => b.status !== 'CLOSED');
            const byBet = new Map(activeBets.map(b => [b.id, b]));

            // Recompute mark-to-market value
            let invested = 0, markValue = 0, unreal = 0;
            const rows = [];

            for (const pos of (positions || [])) {
                const bet = byBet.get(pos.betId);
                if (!bet) continue;
                ensureMarketState(bet);
                const outcome = bet.outcomes.find(o => o.id === pos.outcomeId);
                if (!outcome) continue;

                const costBasis = pos.shares * pos.avgPrice;
                const mark = pos.shares * (outcome.price || 0); // $ per share is prob of winning (mark-to-market)
                const pnl = mark - costBasis;

                invested += costBasis;
                markValue += mark;
                unreal += pnl;

                rows.push({ bet, outcome, pos, costBasis, mark, pnl });
            }

            // Sort by largest absolute mark value
            rows.sort((a,b)=> (b.mark - a.mark) || (b.pnl - a.pnl));

            if (!rows.length) {
                return `
                    <div class="glass rounded-3xl p-16 text-center border border-white/5">
                        <div class="w-16 h-16 rounded-2xl bg-apple-gray-2 mx-auto mb-6 flex items-center justify-center">

            const isProfit = unreal >= 0;

            // Category breakdown
            const byCat = {};
            for (const r of rows) {
                const c = (r.bet.category || 'Uncategorized');
                byCat[c] = (byCat[c] || 0) + r.mark;
            }
            const topCats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,4);

                            <div class="text-2xl font-black mt-1">${formatCurrency(invested)}</div>
                        </div>
                        <div class="glass rounded-2xl p-5 border border-white/10">
                            <div class="text-xs text-apple-text-secondary uppercase tracking-wider">Unrealized P&L</div>
                            <div class="text-2xl font-black mt-1 ${isProfit?'text-apple-green':'text-apple-red'}">${isProfit?'+':''}${formatCurrency(unreal)}</div>
                        </div>
                    </div>

                    <div class="glass rounded-2xl p-5 border border-white/10">
                        <div class="flex items-center justify-between">
                            <div>
                                <div class="text-sm font-black">Exposure by category</div>

                        <div class="mt-3 flex flex-wrap gap-2">
                            ${topCats.map(([c,v])=>`<span class="chip text-[11px] text-apple-text-secondary">${escapeHtml(c)} • ${formatCurrency(v)}</span>`).join('')}
                        </div>
                    </div>

                    <div class="space-y-3">
                        ${rows.map((r, index) => {
                            const profit = r.pnl;
                            const prof = profit >= 0;
                            const nowPct = ((r.outcome.price||0)*100).toFixed(0);
                            const avgPct = (r.pos.avgPrice*100).toFixed(0);

                                            <div class="text-xs text-apple-text-secondary mb-1 uppercase tracking-wide">Avg</div>
                                            <div class="font-black">${avgPct}%</div>

                                        <div>
                                            <div class="text-xs text-apple-text-secondary mb-1 uppercase tracking-wide">Now</div>

        }

function renderLeaderboard() {
            const league = state.leagues[state.currentLeague];
            ensureLeagueExtras(league);

            if (!state.lb) state.lb = { metric: 'NETWORTH', seasonId: 'ALL' };

            const seasons = league.settings?.seasonsEnabled ? (league.seasons || []) : [];
            const seasonOptions = [{ id: 'ALL', name: 'All-time' }, ...seasons.map(s => ({ id: String(s.id), name: s.end ? s.name : (s.name + ' (current)') }))];

            const uniqueMembers = [...new Set([...league.members, state.username])];

            function getSeasonStartBalance(user) {
                if (state.lb.seasonId === 'ALL') return league.startingFunds;
                const s = seasons.find(x => String(x.id) === String(state.lb.seasonId));
                if (!s) return league.startingFunds;
                return (s.startBalances && typeof s.startBalances[user] === 'number') ? s.startBalances[user] : league.startingFunds;
            }

            const memberStats = uniqueMembers.map(member => {
                const bal = member === state.username
                    ? state.balance
                    : (state.leagueBalances[state.currentLeague]?.[member] ?? league.startingFunds);

                const allProfit = bal - league.startingFunds;
                const seasonProfit = bal - getSeasonStartBalance(member);

                const metricVal = (() => {
                    if (state.lb.metric === 'NETWORTH') return bal;
                    if (state.lb.metric === 'ALL_PROFIT') return allProfit;
                    if (state.lb.metric === 'SEASON_PROFIT') return seasonProfit;
                    return bal;
                })();

                const badges = (league.badges?.[member] || []).slice(0, 3).map(id => BADGES.find(b=>b.id===id)).filter(Boolean);

                return {
                    name: member,
                    balance: bal,
                    allProfit,
                    seasonProfit,
                    metricVal,
                    isCurrentUser: member === state.username,
                    badges
                };
            });

            memberStats.sort((a,b) => (b.metricVal - a.metricVal) || (b.balance - a.balance) || a.name.localeCompare(b.name));

            const metricLabel = {
                NETWORTH: 'Net Worth',
                ALL_PROFIT: 'All-time Profit',
                SEASON_PROFIT: 'Season Profit',
            }[state.lb.metric] || 'Net Worth';

            const seasonLabel = seasonOptions.find(o => o.id === state.lb.seasonId)?.name || 'All-time';

            const canSeason = !!league.settings?.seasonsEnabled && isCommissioner();

            return `
                <div class="max-w-4xl mx-auto">
                    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3 mb-5">
                        <div>
                            <div class="text-sm text-apple-text-secondary font-bold uppercase tracking-wider">Leaderboard</div>
                            <div class="text-2xl font-black">${metricLabel} • ${seasonLabel}</div>
                            <div class="text-xs text-apple-text-secondary mt-1">Starting funds: ${formatCurrency(league.startingFunds)} • Badges appear under your name.</div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <select class="input-apple text-sm" onchange="state.lb.metric=this.value; updateUI()">
                                <option value="NETWORTH" ${state.lb.metric==='NETWORTH'?'selected':''}>Net worth</option>
                                <option value="ALL_PROFIT" ${state.lb.metric==='ALL_PROFIT'?'selected':''}>All-time profit</option>
                                <option value="SEASON_PROFIT" ${state.lb.metric==='SEASON_PROFIT'?'selected':''}>Season profit</option>
                            </select>
                            <select class="input-apple text-sm" onchange="state.lb.seasonId=this.value; updateUI()">
                                ${seasonOptions.map(s=>`<option value="${s.id}" ${String(state.lb.seasonId)===String(s.id)?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
                            </select>
                            <button class="btn-quiet px-4 py-2 text-sm ripple ${canSeason?'':'opacity-40 pointer-events-none'}" onclick="startNewSeason()">Start new season</button>
                        </div>
                    </div>

                    <div class="glass rounded-3xl border border-white/5 overflow-hidden">
                        <div class="divide-y divide-white/5">
                            ${memberStats.map((m, idx) => {
                                const rankColors = ['#ffd700', '#c0c0c0', '#cd7f32'];
                                const rankColor = idx < 3 ? rankColors[idx] : '#636366';

                                const rightVal = (() => {
                                    if (state.lb.metric === 'NETWORTH') return formatCurrency(m.balance);
                                    if (state.lb.metric === 'ALL_PROFIT') return (m.allProfit>=0?'+':'') + formatCurrency(m.allProfit);
                                    if (state.lb.metric === 'SEASON_PROFIT') return (m.seasonProfit>=0?'+':'') + formatCurrency(m.seasonProfit);
                                    return formatCurrency(m.balance);
                                })();

                                const rightSub = state.lb.metric === 'NETWORTH'
                                    ? ((m.allProfit>=0?'+':'') + formatCurrency(m.allProfit))
                                    : formatCurrency(m.balance);

                                return `
                                    <div class="px-7 py-6 flex items-center justify-between ${m.isCurrentUser ? 'bg-apple-blue/5 border-l-4 border-apple-blue' : ''}">
                                        <div class="flex items-center gap-4">
                                            <div class="w-10 h-10 rounded-full flex items-center justify-center font-black text-lg" style="background:${rankColor}22; color:${rankColor};">
                                                ${idx+1}
                                            </div>
                                            <div>
                                                <div class="font-black flex items-center gap-2">
                                                    ${escapeHtml(m.name)}
                                                    ${m.isCurrentUser ? '<span class="text-xs text-apple-blue">(You)</span>' : ''}
                                                </div>
                                                <div class="mt-1 flex flex-wrap gap-2">
                                                    ${m.badges.length ? m.badges.map(b => `
                                                        <span class="chip text-[11px] text-apple-text-secondary" title="${escapeHtml(b.desc)}">🏷️ ${escapeHtml(b.name)}</span>
                                                    `).join('') : '<span class="text-xs text-apple-text-secondary">No badges yet</span>'}
                                                </div>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-xs text-apple-text-secondary uppercase tracking-wide mb-1">${escapeHtml(metricLabel)}</div>
                                            <div class="text-2xl font-black">${escapeHtml(rightVal)}</div>
                                            <div class="text-xs text-apple-text-secondary font-mono">${escapeHtml(rightSub)}</div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function startNewSeason() {
            const league = state.leagues[state.currentLeague];
            ensureLeagueExtras(league);
            if (!isCommissioner() || !league.settings?.seasonsEnabled) return;
            const cur = (league.seasons||[]).find(s => !s.end);
            if (cur) cur.end = Date.now();
            const nextId = (Math.max(0, ...(league.seasons||[]).map(s=>s.id||0)) + 1);
            const startBalances = Object.fromEntries((league.members||[]).map(m => [m, (state.leagueBalances[state.currentLeague]?.[m] ?? league.startingFunds)]));
            startBalances[state.username] = state.balance;
            league.seasons.push({ id: nextId, name: `Season ${nextId}`, start: Date.now(), end: null, startBalances });
            pushInbox('season', `New season started: Season ${nextId}`);
            saveAppState();
            updateUI();
        }

        
        function renderSocial() {
            if (!state.socialTab) state.socialTab = 'CHAT';
            const tabs = `
                <div class="flex items-center gap-2 flex-wrap">
                    <button class="px-3 py-2 rounded-xl text-xs font-black border ${state.socialTab==='CHAT'?'bg-white/10 border-white/15':'bg-white/5 border-white/10 hover:bg-white/8'}" onclick="setSocialTab('CHAT')">Chat</button>
                    <button class="px-3 py-2 rounded-xl text-xs font-black border ${state.socialTab==='COMMENTS'?'bg-white/10 border-white/15':'bg-white/5 border-white/10 hover:bg-white/8'}" onclick="setSocialTab('COMMENTS')">Comments</button>
                    <button class="px-3 py-2 rounded-xl text-xs font-black border ${state.socialTab==='ACTIVITY'?'bg-white/10 border-white/15':'bg-white/5 border-white/10 hover:bg-white/8'}" onclick="setSocialTab('ACTIVITY')">Activity</button>
                    <button class="px-3 py-2 rounded-xl text-xs font-black border ${state.socialTab==='ANNOUNCE'?'bg-white/10 border-white/15':'bg-white/5 border-white/10 hover:bg-white/8'}" onclick="setSocialTab('ANNOUNCE')">Announcements</button>
                </div>
            `;
            const panel = (() => {
                if (state.socialTab === 'ACTIVITY') return renderActivity();
                if (state.socialTab === 'ANNOUNCE') return renderAnnouncements();
                if (state.socialTab === 'COMMENTS') return renderRecentComments();
                return renderChat();
            })();
            return `
                <div class="wow-shell rounded-[26px] p-6">
                    <div class="flex items-center justify-between gap-4">
                        <div>
                            <div class="text-xs text-apple-text-secondary uppercase tracking-widest">Social</div>
                            <div class="text-2xl font-black">League feed</div>
                            <div class="text-xs text-apple-text-secondary mt-1">Chat + comments + announcements, unified.</div>
                        </div>
                        ${tabs}
                    </div>
                    <div class="mt-5">${panel}</div>
                </div>
            `;
        }
        function setSocialTab(tab){ state.socialTab = tab; saveAppState(); updateUI(); }

        function renderAnnouncements() {
            const league = state.leagues[state.currentLeague];
            if (!league.announcements) league.announcements = [];
            const items = league.announcements.slice().sort((a,b)=> (b.at||'').localeCompare(a.at||''));
            return `
                <div class="grid lg:grid-cols-3 gap-5">
                    <div class="lg:col-span-2 space-y-3">
                        ${items.length ? items.map(a => `
                            <div class="rounded-2xl border border-white/10 bg-black/30 p-4">
                                <div class="flex items-center justify-between gap-3">
                                    <div class="text-sm font-black">${escapeHtml(a.title||'Announcement')}</div>
                                    <div class="text-xs text-apple-text-secondary font-mono">${formatTime(a.at)}</div>
                                </div>
                                <div class="mt-2 text-sm text-apple-text-secondary whitespace-pre-wrap">${escapeHtml(a.body||'')}</div>
                            </div>
                        `).join('') : `<div class="text-sm text-apple-text-secondary">No announcements yet.</div>`}
                    </div>
                    <div class="rounded-2xl border border-white/10 bg-black/25 p-4 h-fit">
                        <div class="text-sm font-black">Post</div>
                        <div class="text-xs text-apple-text-secondary mt-1">${isCommissioner() ? 'Commissioner can post updates.' : 'Only commissioner can post.'}</div>
                        <div class="mt-4 space-y-2">
                            <input id="announce-title" class="input-apple w-full" placeholder="Title" ${isCommissioner()?'':'disabled'}>
                            <textarea id="announce-body" class="input-apple w-full min-h-[110px]" placeholder="Write an update..." ${isCommissioner()?'':'disabled'}></textarea>
                            <button class="btn-primary w-full py-2.5 text-sm ripple ${isCommissioner()?'':'opacity-50 cursor-not-allowed'}" onclick="${isCommissioner()?'postAnnouncement()':'void 0'}">Post announcement</button>

                    </div>
                </div>

        function postAnnouncement(){
            if (!isCommissioner()) return;
            const league = state.leagues[state.currentLeague];
            if (!league.announcements) league.announcements = [];
            const title = (document.getElementById('announce-title')?.value||'').trim();
            const body = (document.getElementById('announce-body')?.value||'').trim();
            if (!title && !body) return showToast('Write something first', 'error');
            league.announcements.unshift({ id: Date.now()+Math.random(), at: nowISO(), author: state.username, title: title || 'Announcement', body });
            logActivity({ type:'ANNOUNCE', message:`${state.username} posted an announcement` });
            saveAppState(); showToast('Posted'); updateUI();
        }

        function renderRecentComments(){
            const league = state.leagues[state.currentLeague];
            const bets = league.bets || [];
            const items = [];
            for (const b of bets){
                if (!b.comments) continue;
                for (const c of b.comments){
                    items.push({ ...c, betId: b.id, betTitle: b.title });

            items.sort((a,b)=> (b.at||'').localeCompare(a.at||''));

            return `
                <div class="space-y-3">
                    ${top.length ? top.map(c=>`
                        <button class="w-full text-left rounded-2xl border border-white/10 bg-black/25 hover:bg-black/30 transition p-4" onclick="openMarket(${c.betId})">
                            <div class="flex items-center justify-between gap-3">
                                <div class="text-sm font-black line-clamp-2">${escapeHtml(c.betTitle||'Market')}</div>
                                <div class="text-xs text-apple-text-secondary font-mono">${formatTime(c.at)}</div>
                            </div>
                            <div class="mt-2 text-sm text-apple-text-secondary whitespace-pre-wrap">${escapeHtml(c.text||'')}</div>
                            <div class="mt-2 text-xs text-apple-text-secondary">— ${escapeHtml(c.author||'')}</div>
                        </button>
                    `).join('') : `<div class="text-sm text-apple-text-secondary">No comments yet.</div>`}
                </div>
            `;
        }
function renderActivity() {
            const items = state.activity.filter(a => !a.league || a.league === state.currentLeague).slice(0, 60);
            const league = state.leagues[state.currentLeague];
            const byBet = new Map((league?.bets||[]).map(b => [String(b.id), b]));
            return `
                <div class="glass rounded-3xl p-6 card-shadow">
                    <div class="flex items-center justify-between mb-4">

                            <div class="text-sm text-apple-text-secondary font-bold uppercase tracking-wider">Activity</div>
                            <div class="text-2xl font-black">What’s happening</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="exportLeague()" class="btn-secondary px-4 py-2 text-sm">Export</button>
                            <button onclick="openImportModal()" class="btn-secondary px-4 py-2 text-sm">Import</button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        ${items.length ? items.map(it => {
                            const b = it.betId != null ? byBet.get(String(it.betId)) : null;
                            const title = b ? b.title : '';
                            const when = new Date(it.at).toLocaleString();

                                <div class="flex items-start justify-between gap-4 p-4 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/7 transition">

                            <div class="p-6 rounded-2xl bg-white/5 border border-white/10 text-apple-text-secondary">

                            </div>
                        `}
                    </div>
                </div>
            `;
        }


        
        // --- CHAT / INBOX ---

        function getLeague() { return state.leagues[state.currentLeague]; }

        function ensureLeagueExtras(league) {
            if (!league) return;
            if (!league.chat) league.chat = [];
            if (!league.announcements) league.announcements = [];
            if (!league.badges) league.badges = {}; // {user: [badgeId]}
            if (!league.seasons) {
                league.seasons = [{
                    id: 1,
                    name: 'Season 1',
                    start: Date.now(),
                    end: null,
                    startBalances: Object.fromEntries((league.members||[]).map(m => [m, league.startingFunds]))
                }];
            }
            if (!league.settings) league.settings = {};
            if (typeof league.settings.seasonsEnabled !== 'boolean') league.settings.seasonsEnabled = true;
            if (typeof league.settings.resolutionWorkflow !== 'boolean') league.settings.resolutionWorkflow = false;
            if (typeof league.settings.allowCommunityOptions !== 'boolean') league.settings.allowCommunityOptions = true;
            if (!league.inbox) league.inbox = []; // items: {id, at, type, message, readBy:{user:true}}
        }

        const BADGES = [
            { id:'first_trade', name:'First Trade', desc:'Placed your first trade.' },
            { id:'called_it', name:'Called It', desc:'Held the winner before close and didn’t sell.' },
            { id:'contrarian', name:'Contrarian', desc:'Bought <20% outcome that won.' },
            { id:'option_creator', name:'Option Creator', desc:'Added an option that later won.' },
            { id:'voter', name:'Voter', desc:'Participated in resolution voting.' },
        ];

        function awardBadge(user, badgeId) {
            const league = getLeague(); ensureLeagueExtras(league);
            if (!league.badges[user]) league.badges[user] = [];
            if (!league.badges[user].includes(badgeId)) {
                league.badges[user].push(badgeId);
                pushInbox('badge', `${user} earned a badge: ${BADGES.find(b=>b.id===badgeId)?.name || badgeId}`);
                saveAppState();
            }
        }

        function pushInbox(type, message) {
            const league = getLeague(); ensureLeagueExtras(league);
            const item = { id: Date.now() + Math.random(), at: Date.now(), type, message, readBy: {} };
            league.inbox.unshift(item);
            updateInboxBadge();
            saveAppState();
        }

        function markInboxRead() {
            const league = getLeague(); ensureLeagueExtras(league);
            for (const it of league.inbox) it.readBy[state.username] = true;
            updateInboxBadge();
            saveAppState();
        }

        function unreadInboxCount() {
            const league = getLeague(); ensureLeagueExtras(league);
            return league.inbox.filter(it => !it.readBy?.[state.username]).length;
        }

        function updateInboxBadge() {
            const badge = document.getElementById('inbox-badge');
            if (!badge) return;
            const n = unreadInboxCount();
            if (n > 0) { badge.style.display = 'inline-flex'; badge.textContent = String(n); }
            else { badge.style.display = 'none'; badge.textContent = '0'; }
        }

        function renderChat() {
            const league = getLeague(); ensureLeagueExtras(league);
            const messages = league.chat.slice(0, 120);
            return `
                <div class="glass rounded-3xl p-6 card-shadow">
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <div>
                            <div class="text-sm text-apple-text-secondary font-bold uppercase tracking-wider">League Chat</div>
                            <div class="text-2xl font-black">Talk smack. Share receipts.</div>
                        </div>
                        <button onclick="openAnnouncementModal()" class="btn-quiet px-4 py-2 text-sm ripple ${isCommissioner() ? '' : 'opacity-40 pointer-events-none'}">Post announcement</button>
                    </div>

                    <div class="h-[380px] overflow-y-auto rounded-2xl bg-black/35 border border-white/10 p-4 space-y-3" id="chat-scroll">
                        ${messages.length ? messages.map(m => `
                            <div class="flex ${m.user===state.username?'justify-end':''}">
                                <div class="max-w-[78%] rounded-2xl px-4 py-3 ${m.user===state.username?'bg-apple-blue/20 border border-apple-blue/30':'bg-white/5 border border-white/10'}">
                                    <div class="text-xs text-apple-text-secondary">${m.user} • ${new Date(m.at).toLocaleTimeString()}</div>
                                    <div class="mt-1 font-semibold">${escapeHtml(m.text)}</div>
                                    ${m.betId ? `<div class="mt-2 text-xs text-apple-text-secondary underline cursor-pointer" onclick="openMarket(${m.betId})">View market</div>`:''}

                            </div>
                        `).join('') : `
                            <div class="text-apple-text-secondary text-sm">No messages yet. Be the first to say something.</div>
                        `}
                    </div>

                    <div class="mt-4 flex gap-2">
                        <input id="chat-input" class="input-apple flex-1" placeholder="Message the league..." onkeydown="if(event.key==='Enter'){sendChatMessage();}">
                        <button class="btn-primary px-5 py-3 text-sm ripple" onclick="sendChatMessage()">Send</button>
                    </div>
                    <div class="mt-2 text-xs text-apple-text-secondary">Tip: In a market modal, use “Share to chat” to link a market.</div>
                </div>
            `;
        }

        function sendChatMessage(betId=null) {
            const league = getLeague(); ensureLeagueExtras(league);
            const input = document.getElementById('chat-input');
            const textVal = (input?.value || '').trim();
            if (!textVal) return;
            league.chat.unshift({ id: Date.now()+Math.random(), at: Date.now(), user: state.username, text: textVal, betId });
            input.value = '';
            pushInbox('chat', `${state.username}: ${textVal.length>60?textVal.slice(0,60)+'…':textVal}`);
            saveAppState();
            updateUI();
            setTimeout(()=>{ const el=document.getElementById('chat-scroll'); if(el) el.scrollTop = 0; }, 30);
        }

        
        function shareMarketToChat(betId) {
            const bet = getCurrentBets().find(b => b.id === betId);
            if (!bet) return;
            const league = getLeague(); ensureLeagueExtras(league);
            league.chat.unshift({ id: Date.now()+Math.random(), at: Date.now(), user: state.username, text: `Shared a market: ${bet.title}`, betId });
            pushInbox('chat', `${state.username} shared: ${bet.title}`);
            saveAppState();
            updateUI();
        }

        function postMarketComment(betId) {
            const bet = getCurrentBets().find(b => b.id === betId);
            if (!bet) return;
            ensureMarketState(bet);
            const input = document.getElementById('market-comment-input');
            const txt = (input?.value || '').trim();
            if (!txt) return;
            bet.comments.unshift({ id: Date.now()+Math.random(), at: Date.now(), user: state.username, text: txt });
            input.value = '';
            pushInbox('comment', `${state.username} commented on: ${bet.title}`);
            saveAppState();
            openMarket(betId);
        }


        function renderInbox() {
            const league = getLeague(); ensureLeagueExtras(league);
            const tab = state.inboxTab || 'NOTIFS';
            const notifs = league.inbox.slice(0, 80);
            const anns = league.announcements.slice(0, 40);
            setTimeout(markInboxRead, 50);
            return `
                <div class="glass rounded-3xl p-6 card-shadow">
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <div>
                            <div class="text-sm text-apple-text-secondary font-bold uppercase tracking-wider">Inbox</div>
                            <div class="text-2xl font-black">Notifications & announcements</div>
                        </div>
                        <div class="flex gap-2">
                            <button class="btn-quiet px-4 py-2 text-sm ${tab==='NOTIFS'?'ring-2 ring-apple-blue/40':''}" onclick="state.inboxTab='NOTIFS'; updateUI()">Notifications</button>
                            <button class="btn-quiet px-4 py-2 text-sm ${tab==='ANNS'?'ring-2 ring-apple-blue/40':''}" onclick="state.inboxTab='ANNS'; updateUI()">Announcements</button>
                        </div>
                    </div>

                    ${tab==='NOTIFS' ? `
                        <div class="space-y-2">
                            ${notifs.length ? notifs.map(it => `
                                <div class="p-4 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/7 transition">
                                    <div class="flex items-center justify-between gap-3">
                                        <div class="font-extrabold">${escapeHtml(it.message)}</div>

        function quoteBuy(betId, outcomeId, amount) {
            const bet = getCurrentBets().find(b => b.id === betId);
            if (!bet) return null;
            ensureMarketState(bet);
            const outcome = bet.outcomes.find(o => o.id === outcomeId);
            if (!outcome) return null;
            const curPrice = outcome.price || 0;
            const est = estimateBuy(bet, outcomeId, Math.max(0.01, amount));
            // compute after-price by simulating q change
            const idx = bet.outcomes.findIndex(o => o.id === outcomeId);
            const qs = bet.outcomes.map(o => o.q);
            const basePrices = lmsrPrices(qs, bet.b);
            const delta = est.shares;
            const qsNew = qs.slice();
            qsNew[idx] = qs[idx] + delta;
            const newPrices = lmsrPrices(qsNew, bet.b);
            const afterPrice = newPrices[idx] || 0;
            const impact = afterPrice - curPrice;
            return { curPrice, afterPrice, shares: est.shares, avg: est.avgPrice, impact };
        }

        function updateTradePreview(betId, outcomeId) {
            try {
                const amount = Math.max(0, state.buyAmount || 0);
                const q = quoteBuy(betId, outcomeId, amount);
                if (!q) return;
                const set = (id, val)=>{ const el=document.getElementById(id); if(el) el.textContent = val; };
                set('tp-cur', (q.curPrice*100).toFixed(1) + '%');
                set('tp-after', (q.afterPrice*100).toFixed(1) + '%');
                set('tp-shares', q.shares.toFixed(2));
                set('tp-avg', (q.avg*100).toFixed(1) + '%');
                const imp = (q.impact*100);
                const impTxt = `${imp>=0?'+':''}${imp.toFixed(1)}% price impact from this trade.`;
                const impactEl = document.getElementById('tp-impact');

        function executePurchase(betId, outcomeId) {
            const amount = state.buyAmount;
            
            if (amount > state.balance) {
                showToast('Insufficient funds', 'error');
                return;
            }

            if (amount < 1) {
                showToast('Minimum bet is $1', 'error');
                return;
            }

            state.balance -= amount;
            
            // Track balance in leagueBalances
            if (!state.leagueBalances[state.currentLeague]) {
                state.leagueBalances[state.currentLeague] = {};
            }
            state.leagueBalances[state.currentLeague][state.username] = state.balance;
            
            const bet = getCurrentBets().find(b => b.id === betId);
            const outcome = bet.outcomes.find(o => o.id === outcomeId);
            
            // LMSR AMM: buy shares of the selected outcome for a fixed dollar cost
ensureMarketState(bet);
const est = estimateBuy(bet, outcomeId, amount);
const shares = est.shares;
const avgPrice = est.avgPrice;

// Apply the trade (increase outstanding shares for this outcome)
outcome.q += shares;

// Track display-only volume
bet.volume = (bet.volume || 0) + amount;

// Recompute prices from LMSR state
updatePricesFromQ(bet);

            // Update price history for all outcomes
            bet.outcomes.forEach(o => {
                o.history.push(o.price);
                if (o.history.length > 50) o.history.shift();
            });

            const betIndex = state.leagues[state.currentLeague].bets.findIndex(b => b.id === bet.id);
            state.leagues[state.currentLeague].bets[betIndex] = bet;

            const existingPosition = state.portfolio.find(p => p.betId === bet.id && p.outcomeId === outcomeId);
            if (existingPosition) {
                const totalShares = existingPosition.shares + shares;
                existingPosition.avgPrice = ((existingPosition.shares * existingPosition.avgPrice) + (shares * avgPrice)) / totalShares;
                existingPosition.shares = totalShares;
            } else {
                state.portfolio.push({
                    betId: bet.id,
                    outcomeId: outcomeId,
                    shares: shares,
                    avgPrice: avgPrice
                });
            }

            
            // Badges: first trade
            try {
                const league = state.leagues[state.currentLeague];
                ensureLeagueExtras(league);
                awardBadge(state.username, 'first_trade');
            } catch(e) {}
            pushInbox('trade', `${state.username} bought ${shares.toFixed(2)} sh of ${outcome.name} in "${bet.title}"`);

closeModal();
            logActivity({ type: 'trade', betId, message: `Bought ${shares.toFixed(2)} shares of ${outcome.name}`, meta: { side: 'BUY', amount, shares, outcome: outcome.name, outcomeId } });
            showToast(`Purchased ${shares.toFixed(2)} shares of ${outcome.name}!`);
            updateUI();
        }

        function sellShares(betId) {
            const posIndex = state.portfolio.findIndex(p => p.betId === betId);
            if (posIndex === -1) return;

            const pos = state.portfolio[posIndex];
            const bet = getCurrentBets().find(b => b.id === betId);
            const outcome = bet.outcomes.find(o => o.id === pos.outcomeId);
            
            // LMSR AMM: sell all your shares for the LMSR refund
ensureMarketState(bet);
const idx = bet.outcomes.findIndex(o => o.id === pos.outcomeId);
const qs = bet.outcomes.map(o => o.q);
const sellValue = refundForDelta(qs, bet.b, idx, pos.shares);

// Apply the trade (decrease outstanding shares)
outcome.q -= pos.shares;

state.balance += sellValue;

// Recompute prices
updatePricesFromQ(bet);

            // Update history
            bet.outcomes.forEach(o => {
                o.history.push(o.price);
                if (o.history.length > 50) o.history.shift();
            });
            
            // Track balance in leagueBalances
            if (!state.leagueBalances[state.currentLeague]) {
                state.leagueBalances[state.currentLeague] = {};
            }
            state.leagueBalances[state.currentLeague][state.username] = state.balance;
            
            state.portfolio.splice(posIndex, 1);
            
            logActivity({ type: 'trade', betId, message: `Sold ${pos.shares.toFixed(2)} shares of ${outcome.name}`, meta: { side: 'SELL', amount: sellValue, shares: pos.shares, outcome: outcome.name, outcomeId: pos.outcomeId } });
            showToast(`Sold for ${formatCurrency(sellValue)}`);
            closeModal();
            setView('DASHBOARD');
            updateUI();
        }

        function resolveMarketInternal(betId, outcomeId, winnerName, meta={}) {
    const bet = getCurrentBets().find(b => b.id === betId);
    if (!bet) return;

    bet.status = 'CLOSED';
    bet.resolvedOutcomeId = outcomeId;
    bet.resolvedAt = Date.now();
    bet.resolvedBy = meta.by || state.username;
    bet.resolution = bet.resolution || null;

    
    const winnerOutcome = bet.outcomes.find(o => o.id === outcomeId);
    // Badge: option creator (if community-added option wins)
    if (winnerOutcome && winnerOutcome.createdBy) {
        awardBadge(winnerOutcome.createdBy, 'option_creator');
    }

    // Badge: voters (workflow)
    if (bet.resolution && bet.resolution.votes) {
        Object.keys(bet.resolution.votes).forEach(u => awardBadge(u, 'voter'));
    }

    // Track whether current user held the winner & if it was contrarian (<20%)
    let heldWinner = false;
    let heldWinnerAvg = null;
let totalPayout = 0;
    state.portfolio.forEach(pos => {
        if (pos.betId === betId && pos.outcomeId === outcomeId) {
            heldWinner = true;
            heldWinnerAvg = pos.avgPrice;
            const payout = pos.shares * 1.00;
            state.balance += payout;
            totalPayout += payout;
        }
    });

    if (heldWinner) {
        awardBadge(state.username, 'called_it');
        if (heldWinnerAvg != null && heldWinnerAvg < 0.20) {
            awardBadge(state.username, 'contrarian');
        }
    }

    // Clear positions for this market after settlement
    state.portfolio = state.portfolio.filter(p => p.betId !== betId);

    const betIndex = state.leagues[state.currentLeague].bets.findIndex(b => b.id === betId);
    state.leagues[state.currentLeague].bets[betIndex] = bet;

    logActivity('RESOLVE', {
        betId, title: bet.title,
        winner: winnerName, payout: totalPayout,
        via: meta.via || 'instant'
    });
    pushInbox('resolve', `Resolved market: "${bet.title}" • Winner: ${winnerName}`);


    showToast(`Resolved: ${winnerName} won • Payouts: ${formatCurrency(totalPayout)}`);
    closeModal();
    setView('DASHBOARD');
    updateUI();
    persistState();
}

function resolveMarket(betId, outcomeId, name) {
    const bet = getCurrentBets().find(b => b.id === betId);
    if (!bet) return;

    // If workflow is enabled, prefer workflow-based finalization.
    if (isWorkflowEnabled()) {
        showToast('Workflow enabled: use Resolve panel to propose/vote/finalize', 'info');
        return;
    }

    return openConfirmModal({title:'Resolve market?', message:`Resolve this market for ${name}? This will execute payouts immediately and cannot be undone.`, danger:true, confirmText:'Resolve', onConfirm: ()=>{ resolveMarketInternal(betId, outcomeId, name, { via: 'instant', by: state.username }); }});
}

function startResolution(betId) {
    const bet = getCurrentBets().find(b => b.id === betId);
    if (!bet) return;
    if (!isWorkflowEnabled()) { showToast('Resolution workflow is disabled for this league', 'error'); return; }
    if (bet.status === 'CLOSED') { showToast('Market already resolved', 'error'); return; }

    if (!bet.resolution) {
        bet.resolution = {
            phase: 'VOTING', // VOTING -> FINALIZED
            proposedOutcomeId: null,
            proposedBy: null,
            startedAt: Date.now(),
            votes: {} // {username: outcomeId}
        };
    }
    bet.status = 'RESOLVING';
    logActivity('RESOLUTION_START', { betId, title: bet.title });
    showToast('Resolution started. Members can vote now.', 'success');
    persistState();
    updateUI();
    try{ openResolutionModal(betId); }catch(e){}
}

function proposeWinner(betId, outcomeId) {
    const bet = getCurrentBets().find(b => b.id === betId);
    if (!bet?.resolution) { showToast('Start resolution first', 'error'); return; }
    if (bet.status === 'CLOSED') return;
    bet.resolution.proposedOutcomeId = outcomeId;
    bet.resolution.proposedBy = state.username;
    logActivity('PROPOSE_WINNER', { betId, title: bet.title, outcomeId });
    showToast('Proposed winner set', 'success');
    persistState();
    updateUI();
    try{ openResolutionModal(betId); }catch(e){}
}

function castResolutionVote(betId, outcomeId) {
    const bet = getCurrentBets().find(b => b.id === betId);
    if (!bet?.resolution) { showToast('Start resolution first', 'error'); return; }
    if (bet.status === 'CLOSED') return;

    bet.resolution.votes[state.username] = outcomeId;
    logActivity('VOTE', { betId, title: bet.title, outcomeId, voter: state.username });
    showToast('Vote saved', 'success');
    persistState();
    updateUI();
    try{ openResolutionModal(betId); }catch(e){}
}

function finalizeResolution(betId) {
    const bet = getCurrentBets().find(b => b.id === betId);
    if (!bet?.resolution) { showToast('Start resolution first', 'error'); return; }
    if (!isCommissioner()) { showToast('Only the commissioner can finalize', 'error'); return; }
    if (bet.status === 'CLOSED') return;

    // Choose winner: proposedOutcomeId if set, else plurality of votes.
    let winnerId = bet.resolution.proposedOutcomeId;
    if (!winnerId) {
        const counts = {};
        Object.values(bet.resolution.votes || {}).forEach(oid => counts[oid] = (counts[oid]||0)+1);
        winnerId = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0] || bet.outcomes[0]?.id;
    }
    const winner = bet.outcomes.find(o=>o.id===winnerId) || bet.outcomes[0];
    if (!winner) { showToast('No outcomes found', 'error'); return; }

    return openConfirmModal({title:'Finalize resolution?', message:`Finalize resolution for: ${winner.name}? This will settle payouts.`, danger:true, confirmText:'Finalize', onConfirm: ()=>{ resolveMarketInternal(betId, winner.id, winner.name, { via: 'workflow', by: state.username }); }});
}

function cancelResolution(betId) {
    const bet = getCurrentBets().find(b => b.id === betId);
    if (!bet) return;
    if (!isCommissioner()) { showToast('Only the commissioner can cancel', 'error'); return; }
    if (!bet.resolution) { showToast('No resolution in progress', 'info'); return; }
    if (bet.status === 'CLOSED') return;

    bet.status = 'OPEN';
    bet.resolution = null;
    logActivity('RESOLUTION_CANCEL', { betId, title: bet.title });
    showToast('Resolution canceled. Trading reopened.', 'success');
    persistState();
    updateUI();
    try{ openResolutionModal(betId); }catch(e){}
}

// --- Kalshi-inspired external tooltip for Chart.js ---

function getOrCreateKalshiTooltip(chart) {
    let el = chart.canvas.parentNode.querySelector('.kalshi-tooltip');
    if (!el) {
        el = document.createElement('div');
        el.className = 'kalshi-tooltip';
        el.innerHTML = '<div class="kt-date"></div><div class="kt-sep"></div><div class="kt-items"></div>';
        chart.canvas.parentNode.style.position = chart.canvas.parentNode.style.position || 'relative';
        chart.canvas.parentNode.appendChild(el);
    }
    return el;
}

function kalshiExternalTooltip(context) {
    // Disable DOM tooltip. We render Kalshi-like hover labels directly on the canvas.
    return;
}

// Kalshi-like inline hover labels that follow the lines and avoid covering them.
// No DOM tooltip box; labels are drawn on-canvas and auto-nudge away from the lines.
const kalshiInlineHoverPlugin = {
  id: 'kalshiInlineHover',
  afterDatasetsDraw(chart) {
    const idx = chart.$hoverIndex;
    if (idx === null || idx === undefined) return;

    const area = chart.chartArea;
    if (!area) return;

    // Gather points at hovered index
    const pts = [];
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di);
      if (meta.hidden) return;
      const el = meta.data && meta.data[idx];
      if (!el) return;

      const p = el.getProps ? el.getProps(['x','y'], true) : { x: el.x, y: el.y };
      const raw = ds.data?.[idx];
      const val = (typeof raw === 'number') ? raw : (raw && typeof raw.y === 'number' ? raw.y : null);
      if (val === null || Number.isNaN(val)) return;

      pts.push({
        label: ds.label || '',
        value: val, // already 0..100
        color: ds.borderColor || '#fff',
        x: p.x,
        y: p.y
      });
    });
    if (!pts.length) return;

    // Sort high->low so top % can be bigger
    pts.sort((a,b) => b.value - a.value);

    const ctx = chart.ctx;
    ctx.save();

    // A subtle outline makes text readable over the lines
    const outline = 'rgba(0,0,0,0.75)';
    const fontSizes = [38, 28, 22, 18, 16, 14];

    // Build label boxes with smart offsets (Kalshi-ish)
    const boxes = [];
    const gap = 6;

    function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
    function hexToRgba(hex, a){
      try{
        const h = (hex||'').replace('#','');
        const r = parseInt(h.substring(0,2),16);
        const g = parseInt(h.substring(2,4),16);
        const b = parseInt(h.substring(4,6),16);
        return `rgba(${r},${g},${b},${a})`;
      }catch(e){
        return `rgba(255,255,255,${a})`;
      }
    }

    pts.forEach((p, rank) => {
      const fs = fontSizes[Math.min(rank, fontSizes.length-1)];
      const pct = (Math.round(p.value * 10) / 10).toFixed(1) + '%';

      // Prefer placing to the right of the point, but stay inside chart area.
      ctx.font = `900 ${fs}px -apple-system, system-ui, sans-serif`;
      const w = ctx.measureText(pct).width;
      const h = fs * 1.05;

      // Initial offsets:
      // - push slightly away from the line (per-rank alternating)
      // - keep near the point so it "tracks" the series
      const sideRight = (p.x + 10 + w <= area.right - 2);
      let x = sideRight ? (p.x + 10) : (p.x - 10 - w);

      // Vertical nudge: keep it off the line (dominant series nudged less)
      const baseNudge = (rank === 0 ? 14 : 18) + (fs * 0.22);
      const dir = (rank % 2 === 0) ? -1 : 1; // alternate up/down
      let y = p.y + dir * baseNudge;

      // Clamp within plot
      x = clamp(x, area.left + 2, area.right - w - 2);
      y = clamp(y, area.top + h/2 + 2, area.bottom - h/2 - 2);

      boxes.push({
        pct, fs, w, h,
        color: p.color,
        // keep reference to the line point so we can avoid sitting right on it
        px: p.x, py: p.y,
        x, y
      });
    });

    // Collision + line-avoidance resolver:
    // - If a label overlaps the line at its anchor (too close), push it further away in its current direction.
    // - If labels overlap each other, push the lower-priority one away (down/up depending on available space).
    function roundedRect(ctx,x,y,w,h,r){
  const rr=Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function overlaps(a,b){
      return !(a.x + a.w + gap < b.x || b.x + b.w + gap < a.x || a.y + a.h/2 + gap < b.y - b.h/2 || b.y + b.h/2 + gap < a.y - a.h/2);
    }

    // Pass 1: ensure each label is not sitting on its own line (distance from anchor y)
    boxes.forEach((b, i) => {
      const minDist = Math.max(12, b.fs * 0.45);
      if (Math.abs(b.y - b.py) < minDist) {
        const sign = (b.y >= b.py) ? 1 : -1;
        b.y = clamp(b.py + sign * minDist, area.top + b.h/2 + 2, area.bottom - b.h/2 - 2);
      }
    });
    // Pass 1.5: avoid sitting on OTHER lines at the hovered x (Kalshi-like nudge)
    // We try a few small vertical nudges away from any nearby line to keep labels readable without dead space.
    const lineYs = pts.map(p => p.y);
    boxes.forEach((b, bi) => {
      const pad = 6;            // extra clearance around lines
      const step = 10;          // nudge step
      for (let t = 0; t < 10; t++) {
        let hit = false;
        for (let li = 0; li < lineYs.length; li++) {
          const ly = lineYs[li];
          // if label's centerline is too close to a line and label spans over the hovered x vicinity, nudge
          const nearY = Math.abs(b.y - ly) < (b.h/2 + pad);
          const spansX = (b.x <= (b.px + 8)) && ((b.x + b.w) >= (b.px - 8));
          if (nearY && spansX) {
            const dir = (b.y >= ly) ? 1 : -1;
            b.y = clamp(b.y + dir * step, area.top + b.h/2 + 2, area.bottom - b.h/2 - 2);
            hit = true;
          }
        }
        if (!hit) break;
      }
    });


    // Pass 2: resolve label-label collisions iteratively
    for (let iter = 0; iter < 18; iter++) {
      let moved = false;
      for (let i = 0; i < boxes.length; i++) {
        for (let j = i+1; j < boxes.length; j++) {
          const a = boxes[i], b = boxes[j];
          if (!overlaps(a,b)) continue;

          // Push the lower-ranked (j) label away from the higher-ranked (i)
          const push = (b.fs * 0.55) + 10;
          const dir = (b.y >= a.y) ? 1 : -1;
          const newY = clamp(b.y + dir * push, area.top + b.h/2 + 2, area.bottom - b.h/2 - 2);

          if (newY !== b.y) {
            b.y = newY;
            // also gently slide sideways if we still collide and have room
            const canRight = (b.x + 10 + b.w <= area.right - 2);
            const canLeft  = (b.x - 10 >= area.left + 2);
            if (canRight) b.x += 6;
            else if (canLeft) b.x -= 6;

            b.x = clamp(b.x, area.left + 2, area.right - b.w - 2);
            moved = true;
          }
        }
      }
      if (!moved) break;
    }

    // Draw date in top-right (small)
    const labelTitle = chart.data.labels?.[idx] || '';
    if (labelTitle) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '700 13px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      ctx.fillText(String(labelTitle).toUpperCase(), area.right - 4, area.top + 4);
    }

    // Draw labels
    boxes.forEach((b) => {
      ctx.font = `900 ${b.fs}px -apple-system, system-ui, sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      // Outline then fill (blocky, readable)
      ctx.lineWidth = Math.max(4, Math.floor(b.fs * 0.12));
      /* label pill */
      const pillPadX = Math.max(10, b.fs*0.22);
      const pillPadY = Math.max(6,  b.fs*0.16);
      const pillW = b.w + pillPadX*2;
      const pillH = b.h + pillPadY*2;
      const pillX = b.x - pillPadX;
      const pillY = (b.y - b.h/2) - pillPadY;
      ctx.save();
      ctx.globalAlpha = 0.72;
      ctx.fillStyle = 'rgba(0,0,0,0.38)';
      roundedRect(ctx, pillX, pillY, pillW, pillH, 12);
      ctx.fill();
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = hexToRgba(b.color, 0.55);
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      /* connector dot */
      ctx.save();
      ctx.fillStyle = b.color;
      ctx.globalAlpha = 0.95;
      ctx.beginPath();
      ctx.arc(b.px, b.py, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();

ctx.strokeStyle = outline;
      ctx.strokeText(b.pct, b.x, b.y);

      ctx.fillStyle = b.color;
      ctx.fillText(b.pct, b.x, b.y);
    });

    ctx.restore();
  }
};

        function createMarket() {
            const title = document.getElementById('market-title-input').value.trim();
            const description = document.getElementById('market-desc-input').value.trim();
            const category = (document.getElementById('market-category-input')?.value || '').trim();
            const isPerson = !!document.getElementById('market-is-person')?.checked;
            const person = isPerson ? (document.getElementById('market-person-input')?.value || '').trim() : '';
            const format = (document.getElementById('market-format-select')?.value || 'BINARY');
            const inputs = document.querySelectorAll('.outcome-input');
            const outcomes = [];
            const colors = ['#0a84ff', '#30d158', '#ff453a', '#ff9f0a', '#bf5af2', '#5856d6'];

            inputs.forEach((input, i) => {
                const val = input.value.trim();
                if (!val) return;
                outcomes.push({
                    id: 'opt_' + i + '_' + Date.now(),
                    name: val,
                    pool: 0, // legacy (unused by LMSR)
                    q: 0, // LMSR outstanding shares
                    color: colors[i % colors.length]
                });
            });

            if (!title) {
                showToast('Question required', 'error');
                return;
            }
            
            if (outcomes.length < 2) {
                showToast('Need at least 2 outcomes', 'error');
                return;
            }


            if (format === 'BINARY') {
                // normalize to exactly Yes/No
                const yn = outcomes.map(o=>o.name.toLowerCase());
                if (outcomes.length !== 2) {
                    showToast('Yes/No markets must have exactly 2 outcomes', 'error');
                    return;
                }
            }

            // Set equal initial prices for new markets (no liquidity yet)
            outcomes.forEach(o => o.price = 1 / outcomes.length);
            
            // New markets get FLAT history (no trades yet)
            const flatValue = 1 / outcomes.length;
            outcomes.forEach(o => {
                o.history = Array(50).fill(flatValue);
            });
            
            const newBet = {
                id: Date.now(),
                title: title,
                format: format,
                description: description || 'No description',
                category: category || 'Uncategorized',
                person: person || '',
                outcomes: outcomes,
                status: 'OPEN',
                created: Date.now(),
                b: 80 * outcomes.length,
                volume: 0
            };
            
            state.leagues[state.currentLeague].bets.unshift(newBet);
            closeModal();
            showToast('Market created!');
            setView('DASHBOARD');
        }

            <p class="text-apple-text-secondary mb-6">Add a new outcome anyone can trade. We'll seed it at ~0.2% so prices barely shift.</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold mb-2 text-apple-text-secondary uppercase tracking-wide">Option name</label>
                    <input id="new-outcome-name" type="text" class="input-apple w-full" placeholder="e.g., Owen">
                </div>
                <button onclick="addOutcomeToMarket(${betId})" class="btn-primary w-full py-4 text-base ripple glow-on-hover">
                    Add Option
                </button>
            </div>
        </div>
    `;
    modal.classList.remove('hidden');
    setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('scale-95');
        applyMarketFormat();
    }, 10);
}


function openAddOptionModal(betId){ return openAddOutcomeModal(betId); }


function openResolutionModal(betId) {

    const bet = getCurrentBets().find(b => b.id === betId);
    if (!bet) return;
    ensureMarketState(bet);

    const league = state.leagues[state.currentLeague];
    const workflow = isWorkflowEnabled();
    const isComm = isCommissioner();

    const modal = document.getElementById('modal-overlay');
    const content = document.getElementById('modal-content');

    const winner = bet.outcomes?.find(o => o.id === bet.resolvedOutcomeId);
    const counts = (() => {
        const c = {};
        const votes = bet.resolution?.votes || {};
        Object.values(votes).forEach(oid => c[oid] = (c[oid]||0) + 1);
        return c;
    })();

    const voteRow = (o) => {
        const myVote = bet.resolution?.votes?.[state.username];
        const n = counts[o.id] || 0;
        const selected = myVote === o.id;
        return `
            <div class="flex items-center justify-between gap-3 p-3 rounded-xl border border-white/10 bg-white/5">
                <div class="flex items-center gap-3 min-w-0">
                    <span class="w-2.5 h-2.5 rounded-full" style="background:${o.color}"></span>
                    <div class="font-black truncate">${escapeHtml(o.name)}</div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="text-sm font-black text-apple-text-secondary">${n} vote${n===1?'':'s'}</div>
                    ${bet.status!=='CLOSED' ? `
                        <button onclick="castResolutionVote(${bet.id}, '${o.id}')" class="px-3 py-2 rounded-lg text-sm font-black border ${selected?'border-apple-blue bg-apple-blue/20':'border-white/10 bg-white/5 hover:bg-white/8'} transition">
                            ${selected?'Voted':'Vote'}
                        </button>
                    ` : ``}
                </div>
            </div>
        `;
    };

    const statusChip = bet.status==='CLOSED'
        ? `<span class="chip text-xs text-apple-text-secondary">RESOLVED</span>`
        : bet.status==='RESOLVING'
            ? `<span class="chip text-xs" style="border-color:rgba(255,255,255,.18); color:rgba(255,255,255,.85)">RESOLVING</span>`
            : `<span class="chip text-xs text-apple-green">OPEN</span>`;

    const instantResolveUI = `
        <div class="stat-card p-4">
            <div class="font-black mb-1">Instant resolve</div>
            <div class="text-xs text-apple-text-secondary mb-3">Workflow is off for this league. Commissioner can settle immediately.</div>
            ${isComm ? `
                <div class="flex items-center gap-2">
                    <select id="instant-resolve-select" class="input-apple flex-1 !py-2 !px-3 text-sm">
                        ${bet.outcomes.map(o=>`<option value="${o.id}">${escapeHtml(o.name)}</option>`).join('')}
                    </select>
                    <button onclick="(function(){ const oid=document.getElementById('instant-resolve-select').value; const o=bet.outcomes.find(x=>x.id===oid); resolveMarketInternal(bet.id, oid, o?o.name:'Winner', {via:'instant', by: state.username}); })()" class="btn-primary px-4 py-2 text-sm">Resolve</button>
                </div>
            ` : `<div class="text-sm text-apple-text-secondary">Only the commissioner can resolve.</div>`}
        </div>
    `;

    const workflowUI = `
        <div class="stat-card p-4">
            <div class="flex items-start justify-between gap-3">
                <div>
                    <div class="font-black">Resolution workflow</div>
                    <div class="text-xs text-apple-text-secondary mt-1">Members vote; commissioner finalizes.</div>
                </div>
                ${bet.status!=='CLOSED' && isComm ? `
                    ${bet.resolution ? `
                        <button onclick="cancelResolution(${bet.id})" class="px-3 py-2 rounded-lg text-sm font-black bg-white/5 border border-white/10 hover:bg-white/8 transition">Cancel</button>
                    ` : `
                        <button onclick="startResolution(${bet.id})" class="px-3 py-2 rounded-lg text-sm font-black bg-white/5 border border-white/10 hover:bg-white/8 transition">Start</button>
                    `}
                ` : ``}
            </div>

            ${bet.resolution ? `
                <div class="mt-4 grid gap-3">
                    ${bet.outcomes.map(o=>voteRow(o)).join('')}
                </div>

                <div class="mt-4 flex flex-col gap-2">
                    <div class="text-xs text-apple-text-secondary">Commissioner tools</div>
                    ${isComm ? `
                        <div class="flex items-center gap-2">
                            <select id="propose-winner-select" class="input-apple flex-1 !py-2 !px-3 text-sm">
                                <option value="">(Plurality winner)</option>
                                ${bet.outcomes.map(o=>`<option value="${o.id}" ${bet.resolution?.proposedOutcomeId===o.id?'selected':''}>${escapeHtml(o.name)}</option>`).join('')}
                            </select>
                            <button onclick="(function(){ const oid=document.getElementById('propose-winner-select').value; if(oid) proposeWinner(${bet.id}, oid); else { bet.resolution.proposedOutcomeId=null; showToast('Using plurality winner', 'info'); persistState(); updateUI(); } })()" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/8 transition text-sm font-black">Set</button>
                            <button onclick="finalizeResolution(${bet.id})" class="btn-primary px-4 py-2 text-sm">Finalize</button>
                        </div>
                    ` : `<div class="text-sm text-apple-text-secondary">Waiting for commissioner to finalize.</div>`}
                </div>
            ` : `
                <div class="mt-4 text-sm text-apple-text-secondary">${isComm ? 'Start resolution when you are ready.' : 'Commissioner will start resolution when ready.'}</div>
            `}
        </div>
    `;

    const resolvedUI = bet.status==='CLOSED' ? `
        <div class="stat-card p-4">
            <div class="font-black mb-1">Result</div>
            <div class="text-sm text-apple-text-secondary">Winner</div>
            <div class="mt-2 text-2xl font-black">${winner ? `<span style="color:${winner.color}">${escapeHtml(winner.name)}</span>` : '—'}</div>
            <div class="mt-2 text-xs text-apple-text-secondary">Resolved at: ${bet.resolvedAt ? new Date(bet.resolvedAt).toLocaleString() : '—'}</div>
        </div>
    ` : '';

    content.innerHTML = `
        <div class="glass rounded-3xl w-full max-w-xl p-8 animate-scale-in shadow-2xl mx-auto border border-white/10">
            <button onclick="closeModal()" class="absolute top-8 right-8 w-10 h-10 rounded-full bg-apple-gray-2 hover:bg-apple-gray-3 flex items-center justify-center transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
            <div class="flex items-center justify-between gap-3">
                <div class="min-w-0">
                    <div class="text-xs text-apple-text-secondary uppercase tracking-widest">Resolve</div>
                    <div class="mt-1 text-2xl font-black truncate">${escapeHtml(bet.title)}</div>
                </div>
                ${statusChip}
            </div>

            <div class="mt-6 space-y-4">
                ${resolvedUI}
                ${workflow ? workflowUI : instantResolveUI}
            </div>
        </div>
    `;

    modal.classList.remove('hidden');
    setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('scale-95');
    }, 10);
}


function pushHistorySnapshot(bet) {
    bet.outcomes.forEach(o => {
        if (!Array.isArray(o.history) || o.history.length === 0) o.history = Array(50).fill(o.price || 0);
        o.history.push(o.price);
        if (o.history.length > 50) o.history.shift();
    });
}

function addOutcomeToMarket(betId) {
    const bet = getCurrentBets().find(b => b.id === betId);
    if (!bet || bet.status !== 'OPEN') return;

    const name = (document.getElementById('new-outcome-name')?.value || '').trim();
    if (!name) { showToast('Name required', 'error'); return; }

    if (bet.outcomes.some(o => o.name.toLowerCase() === name.toLowerCase())) {
        showToast('That option already exists', 'error');
        return;
    }

    ensureMarketState(bet);

    // Seed the new option at a tiny probability to avoid disrupting the market.
    const pNew = 0.002; // ~0.2%
    const b = bet.b;
    const S = bet.outcomes.reduce((acc, o) => acc + Math.exp(o.q / b), 0);
    const qNew = b * (Math.log(pNew / (1 - pNew)) + Math.log(S));

    const colors = ['#0a84ff', '#30d158', '#ff453a', '#ff9f0a', '#bf5af2', '#5856d6', '#64d2ff', '#ffd60a'];
    const color = colors[bet.outcomes.length % colors.length];

    const historyLen = bet.outcomes[0]?.history?.length || 50;

    bet.outcomes.push({
        id: 'opt_' + bet.outcomes.length + '_' + Date.now(),
        name,
        pool: 0,
        q: qNew,
        color,
        history: Array(historyLen).fill(pNew),
        createdBy: state.username,
        createdAt: Date.now()
    });

    updatePricesFromQ(bet);
    pushHistorySnapshot(bet);

    const newId = bet.outcomes[bet.outcomes.length-1].id;
    state.uiFlash = { betId, outcomeId: newId, at: Date.now() };
    showToast(`Option “${name}” added!`, 'success');
    logActivity({ type:'option', betId, message: `${state.username} added option: ${name}` });
    pushInbox('option', `${state.username} added option "${name}" in "${bet.title}"`);

    openMarket(betId);
    updateUI();
    setTimeout(() => { if (state.uiFlash && state.uiFlash.outcomeId === newId) state.uiFlash = null; }, 1600);
}

        setView('LANDING');
   
        function drawSpotlightChart() {
            const league = state.leagues[state.currentLeague];
            const activeBets = league.bets.filter(b => b.status === 'OPEN');
            const bet = activeBets.find(b => b.id === state.activeBetId) || activeBets[0];
            const canvas = document.getElementById('spotlight-chart');
            if (!canvas || !bet) return;
            // reuse main chart renderer but target spotlight canvas
            drawMarketChartInto(bet.id, canvas);
        }

        function drawMarketChartInto(betId, canvasEl) {
            const bet = getCurrentBets().find(b => b.id === betId);
            if (!bet || !canvasEl) return;
            ensureMarketState(bet);
            const ctx = canvasEl.getContext('2d');
            if (canvasEl._chart) { try { canvasEl._chart.destroy(); } catch(e){} }
            const labels = Array.from({length: bet.outcomes[0]?.history?.length || 50}, (_, i) => i);
            const datasets = bet.outcomes.map(o => ({
                label: o.name,
                data: o.history.map(v => Math.round(v*1000)/10),
                borderColor: o.color,
                backgroundColor: o.color,
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.25,
            }));
            const chart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: { x: { display: false }, y: { display: false, min: 0, max: 100 } },
                    interaction: { intersect: false, mode: 'index' },
                    animation: false,
                    elements: { line: { capBezierPoints: true } },
                }
            });
            canvasEl._chart = chart;
        }
